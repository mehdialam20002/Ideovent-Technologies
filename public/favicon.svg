<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="ivfaT ivfaD">
  <title id="ivfaT">Ideovent Technologies - favicon</title>
  <desc id="ivfaD">The Ideovent iV monogram reversed out of a deep navy rounded square, thickened so it stays legible at 16 pixels.</desc>
  <!-- Ideovent Technologies. Redrawn from 01-brand/logo/source/ideovent-official.png.
       Geometry and colour: see 01-brand/logo/LOGO-USAGE.md.
       Rebuild: python _build/build_logo_assets.py -->
  <!-- OPTICAL-SIZE VARIANT. At 16 px the chevron notch, the gap between
       the V strokes and the i stem all fall below one device pixel, so
       each is corrected: the notch is closed, the chevron is 8% larger,
       the stem is widened to 23 units (from 8.92) and each V stroke
       gains 3 units on its inner edge. Use ideovent-mark.svg at 24 px
       and above; this file only below that. -->
