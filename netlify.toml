# Netlify build configuration for the Ideovent Technologies website.
# Full walkthrough: ../DEPLOY-GUIDE.md
#
# Redirects live in public/_redirects, not here, so that they ship inside dist/
# and can be tested against a locally served build.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin the toolchain so a Netlify image upgrade cannot change the output.
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"
  # DEPLOY_BASE is deliberately NOT set. vite.config.ts falls back to "/", which
  # is what a custom domain needs. Setting it (as the GitHub Pages workflow does)
  # serves the site from a sub-path and breaks every asset URL, the router
  # basename and the origin baked into certificate QR codes.

# Deploy previews and branch builds must never be indexed — they are public URLs
# on netlify.app that would otherwise compete with the real site in search.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"

# ── Security headers ──────────────────────────────────────────────────────────
# No Content-Security-Policy yet: the site loads Google Fonts, a Google Maps
# iframe and (when configured) Supabase and EmailJS, so a CSP needs to be written
# against that list and tested. Adding a wrong one silently breaks the page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── Caching ───────────────────────────────────────────────────────────────────
# Vite fingerprints everything in /assets, so it is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached, or a visitor keeps loading a stale build that
# references asset filenames the new deploy no longer has.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Screenshots are not fingerprinted, so they get revalidation rather than an
# immutable cache.
#
# CAREFUL: "/work/*" is NOT only the screenshot files. /work/<slug> is a real
# route for all eleven case studies, and the SPA fallback answers it with
# index.html. A header rule matches the REQUEST path, so a blanket
# "max-age=86400" on /work/* pins the HTML shell in the browser for a day —
# and after the next deploy that shell asks for fingerprinted /assets/ files
# that no longer exist, which is a blank page. That is the exact failure the
# /index.html rule above exists to prevent.
#
# So: the safe, revalidating value is the default for everything under /work/,
# and only the .webp screenshots are allowed the long cache. Netlify merges
# matching rules with the later one winning, so if the extension pattern is not
# honoured the images simply fall back to revalidation — a missed optimisation,
# never a broken page.
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/work/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
