<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta (per-route values are managed at runtime via react-helmet-async) -->
    <title>Ideovent Technologies — Digital Studio for Websites, Apps & Brands</title>
    <meta
      name="description"
      content="Ideovent Technologies is a digital studio crafting high-performance websites, mobile apps, brands and marketing that help ambitious businesses grow."
    />
    <meta
      name="keywords"
      content="Ideovent Technologies, web development, mobile app development, UI UX design, digital agency, branding, SEO, Deoria, Uttar Pradesh, India"
    />
    <meta name="author" content="Ideovent Technologies" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://ideovent.com/" />

    <!-- Icons / PWA -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" href="%BASE_URL%ideovent.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%ideovent.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Ideovent Technologies" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ideovent Technologies — Digital Studio" />
    <meta
      property="og:description"
      content="A digital studio crafting high-performance websites, apps, brands and marketing for ambitious businesses."
    />
    <meta property="og:url" content="https://ideovent.com/" />
    <meta property="og:image" content="https://ideovent.com/ideovent.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ideovent_tech" />
    <meta name="twitter:title" content="Ideovent Technologies — Digital Studio" />
    <meta
      name="twitter:description"
      content="A digital studio crafting high-performance websites, apps, brands and marketing for ambitious businesses."
    />
    <meta name="twitter:image" content="https://ideovent.com/ideovent.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Ideovent Technologies",
        "image": "https://ideovent.com/ideovent.png",
        "description": "Digital studio for websites, mobile apps, branding and digital marketing.",
        "url": "https://ideovent.com",
        "telephone": "+919410707967",
        "email": "contact@ideovent.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Salempur",
          "addressLocality": "Deoria",
          "addressRegion": "Uttar Pradesh",
          "postalCode": "274509",
          "addressCountry": "IN"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 26.3, "longitude": 83.916667 },
        "openingHours": "Mo-Fr 09:00-18:00",
        "sameAs": [
          "https://www.linkedin.com/company/ideovent-technologies",
          "https://x.com/Ideovent_",
          "https://www.instagram.com/ideovent_official"
        ]
      }
    </script>

    <!-- Fonts: Space Grotesk (display) · Inter (body) · Instrument Serif (editorial italic accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
